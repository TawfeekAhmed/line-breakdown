<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Line Breakdown</title>
<meta name="theme-color" content="#414E3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Line Breakdown">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--g:#414E3F;--g2:#5B6B58;--cream:#F3EFE4;--amber:#E9A23B;--red:#C0392B;--ok:#2E7D4F;--bg:#F7F5EF;--card:#fff;--ink:#1F2620;--mut:#6B7368;--line:#E2DED2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:var(--cream);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
header img{height:30px;filter:brightness(0) invert(.95) sepia(.2)}
header .t{font-weight:700;font-size:17px;flex:1}
header .u{font-size:12px;opacity:.85;text-align:right}
main{padding:12px 12px 90px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px;color:var(--g)}
h3{font-size:14px;margin:14px 0 8px;color:var(--g)}
.btn{border:0;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--g);color:#fff;cursor:pointer}
.btn.sec{background:var(--cream);color:var(--g)}
.btn.amb{background:var(--amber);color:#2b2b2b}
.btn.red{background:var(--red)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:70px}
.seg{display:flex;background:var(--cream);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--g);font-size:13px}
.seg button.on{background:var(--g);color:#fff}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700}
.p-open{background:#FDE7E4;color:var(--red)}.p-closed{background:#E3F2E8;color:var(--ok)}
.p-k{background:var(--cream);color:var(--g)}
.item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.item .th{width:54px;height:54px;border-radius:9px;background:var(--cream) center/cover;flex:none}
.item .m{flex:1;min-width:0}
.item .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:12.5px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kpi{background:var(--cream);border-radius:12px;padding:10px}
.kpi .v{font-size:21px;font-weight:800;color:var(--g)}
.kpi .l{font-size:11.5px;color:var(--mut)}
.kpi.warn .v{color:var(--red)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar .n{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:var(--cream);border-radius:6px;height:16px;overflow:hidden}
.bar .f{height:100%;background:var(--g2)}
.bar .x{width:62px;text-align:right;font-weight:700}
.daycard{background:linear-gradient(135deg,var(--g),#2F392E);color:var(--cream);border:0}
.daycard h2{color:var(--cream)}
.big{font-size:28px;font-weight:800}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{width:84px;height:84px;border-radius:10px;background:#ddd center/cover;position:relative}
.photos .ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:700}
.photos .ph.vid::after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;text-shadow:0 0 6px #000}
.modal{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.modal .tb{display:flex;gap:6px;padding:8px;background:#111;flex-wrap:wrap;align-items:center;padding-top:max(8px,env(safe-area-inset-top))}
.modal .tb button{background:#2a2a2a;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:13px}
.modal .tb button.on{outline:2px solid var(--amber)}
.modal .cv{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.modal canvas{max-width:100%;max-height:100%;touch-action:none}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #555;padding:0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90%}
.empty{text-align:center;color:var(--mut);padding:24px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--g);font-size:12px}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--g);color:var(--cream)}
.login img.ic{width:110px;border-radius:26px;box-shadow:0 8px 30px #0005}
.login .box{background:#fff;color:var(--ink);border-radius:16px;padding:18px;width:100%;max-width:380px;margin-top:20px}
.warnbox{background:#FFF4E0;border:1px solid #F1C67A;border-radius:10px;padding:10px;font-size:13px}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print .pg{page-break-after:always}}
</style>
</head>

function pinHash(name,pin){const s=String(name).trim().toLowerCase()+':'+String(pin).trim();let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

/* ---------- storage (IndexedDB with in-memory fallback) ---------- */
const DB={db:null,mem:{records:{},days:{},media:{},meta:{}},
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('linebreakdown',1);r.onupgradeneeded=()=>{const d=r.result;['records','days','media','meta'].forEach(s=>d.createObjectStore(s))};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
 async put(s,k,v){if(!this.db){this.mem[s][k]=v;return}return new Promise((res,rej)=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
 async get(s,k){if(!this.db)return this.mem[s][k];return new Promise(res=>{const r=this.db.transaction(s).objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)})},
 async del(s,k){if(!this.db){delete this.mem[s][k];return}return new Promise(res=>{const t=this.db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res})},
 async all(s){if(!this.db)return Object.values(this.mem[s]);return new Promise(res=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})}};

function uid(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
const pad=n=>String(n).padStart(2,'0');
function fmtDT(ms){if(!ms)return '—';const d=new Date(ms);return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtFull(ms){if(!ms)return '';const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function toLocalInput(ms){if(!ms)return '';const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}

/* ---------- calculations ---------- */
function clip(r,d){const s=Math.max(r.start,d.start),e=Math.min(r.end||Date.now(),d.end||Date.now());return Math.max(0,e-s)}
function periodRange(){const p=S.period;let f,t;const ref=new Date(p.ref+'T00:00');
 if(p.mode==='day'){const d=S.days.find(x=>x.id===S.dayPick)||S.days[0];return {days:d?[d]:[],label:d?('Production day '+d.id):'No production day'}}
 if(p.mode==='week'){f=new Date(ref);t=new Date(ref);t.setDate(t.getDate()+7)}
 if(p.mode==='month'){f=new Date(ref.getFullYear(),ref.getMonth(),1);t=new Date(ref.getFullYear(),ref.getMonth()+1,1)}
 if(p.mode==='year'){f=new Date(ref.getFullYear(),0,1);t=new Date(ref.getFullYear()+1,0,1)}
 if(p.mode==='custom'){f=new Date(p.from+'T00:00');t=new Date(p.to+'T00:00');t.setDate(t.getDate()+1)}
 const days=S.days.filter(d=>d.start>=f.getTime()&&d.start<t.getTime());
 const lbl={week:'Week from '+p.ref,month:f.toLocaleString('en',{month:'long',year:'numeric'}),year:String(f.getFullYear()),custom:p.from+' → '+p.to}[p.mode];
 return {days,label:lbl}}
function analyse(days,equip){
 const ids=new Set(days.map(d=>d.id));const byId=Object.fromEntries(days.map(d=>[d.id,d]));
 const recs=S.records.filter(r=>ids.has(r.dayId));
 let prod=0;days.forEach(d=>prod+=(d.end||Date.now())-d.start);
 const A={sec:{},secMin:0,secN:0,prodMin:mins(prod),planned:0,unplanned:0,down:0,maint:0,byType:{},byCat:{},byArea:{},byEquip:{},nBd:0,nMaint:0,recs,open:0};
 recs.forEach(r=>{const m=mins(clip(r,byId[r.dayId]));if(r.end==null)A.open++;
  if(r.kind==='planned'){A.planned+=m;return}
  if(equip&&r.equipment!==equip)return;
  A.byCat[r.category]=(A.byCat[r.category]||0)+m;
  if(r.kind==='breakdown'&&r.line==='Secondary'){A.secMin+=m;A.secN++;const k=r.area+' – '+(r.equipment||'?');A.sec[k]=(A.sec[k]||0)+m;return}
  if(r.kind==='unplanned'){A.unplanned+=m;A.byType['Logistics']=(A.byType['Logistics']||0)+m;return}
  A.down+=m;A.nBd++;A.byType[r.category]=(A.byType[r.category]||0)+m;
  if(r.category==='Maintenance'){A.maint+=m;A.nMaint++}
  if(r.area)A.byArea[r.area]=(A.byArea[r.area]||0)+m;
  if(r.equipment){const e=A.byEquip[r.equipment]||(A.byEquip[r.equipment]={min:0,n:0,area:r.area});e.min+=m;e.n++}});
 A.net=Math.max(0,A.prodMin-A.planned);
 A.totalStop=A.down+A.unplanned;
 A.avail=A.net?(A.net-A.totalStop)/A.net:null;
 A.maintAvail=A.net?(A.net-A.maint)/A.net:null;
 A.mttr=A.nBd?A.down/A.nBd:null;
 A.mtbf=A.nBd?(A.net-A.down)/A.nBd:null;
 A.mttrM=A.nMaint?A.maint/A.nMaint:null;A.mtbfM=A.nMaint?(A.net-A.maint)/A.nMaint:null;
 A.pct=A.net?A.totalStop/A.net:null;
 return A}

async function drawPhotos(r){const box=$('#ph');if(!box)return;box.innerHTML='';

  d.innerHTML='<button>×</button>';d.querySelector('button').onclick=ev=>{ev.stopPropagation();arr.splice(arr.indexOf(id),1);drawPhotos(r)};
  d.onclick=async()=>{if(!m)return;if(isV){const u=m.blob?URL.createObjectURL(m.blob):m.url;window.open(u)}else{const img=await loadImg(m.blob);annotate(img,async(blob,thumb)=>{m.blob=blob;m.thumb=thumb;m.synced=false;await DB.put('media',id,m);drawPhotos(r)})}};box.appendChild(d)}}
function shrink(img){return new Promise(res=>{const M=1600,sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const t=document.createElement('canvas');const ts=200/Math.max(c.width,c.height);t.width=c.width*ts;t.height=c.height*ts;t.getContext('2d').drawImage(c,0,0,t.width,t.height);c.toBlob(b=>res({blob:b,thumb:t.toDataURL('image/jpeg',.7)}),'image/jpeg',.82)})}
function loadImg(blob){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(blob)})}

/* ---------- photo annotation ---------- */
function annotate(img,done){
 const M=1600;const sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const W=Math.round(img.naturalWidth*sc),H=Math.round(img.naturalHeight*sc);
 const md=document.createElement('div');md.className='modal';
 const cols=['#FF2D2D','#FFD400','#22C55E','#2F80ED','#FFFFFF'];let col=cols[0],tool='arrow',shapes=[],cur=null;
 md.innerHTML=`<div class="tb">${[['pen','✎ Pen'],['arrow','➜ Arrow'],['rect','▭ Box'],['circle','◯ Circle']].map(([k,l])=>`<button data-t="${k}">${l}</button>`).join('')}
 ${cols.map(c=>`<button class="sw" data-c="${c}" style="background:${c}"></button>`).join('')}<button id="un">↶ Undo</button><span style="flex:1"></span><button id="cn">Cancel</button><button id="dn" style="background:var(--amber);color:#222;font-weight:700">Done</button></div><div class="cv"><canvas></canvas></div>`;
 document.body.appendChild(md);const cv=md.querySelector('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
 const lw=Math.max(4,W/180);
 function drawShape(s){g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
  if(s.t==='pen'){g.beginPath();s.p.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}
  else{const [x0,y0]=s.p[0],[x1,y1]=s.p[s.p.length-1];
   if(s.t==='rect'){g.strokeRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0))}
   if(s.t==='circle'){g.beginPath();g.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);g.stroke()}
   if(s.t==='arrow'){const a=Math.atan2(y1-y0,x1-x0),h=lw*5;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-h*Math.cos(a-.45),y1-h*Math.sin(a-.45));g.lineTo(x1-h*Math.cos(a+.45),y1-h*Math.sin(a+.45));g.closePath();g.fill()}}}
 function redraw(){g.drawImage(img,0,0,W,H);shapes.forEach(drawShape);if(cur)drawShape(cur)}
 redraw();
 const pos=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur={t:tool,c:col,p:[pos(e)]}};
 cv.onpointermove=e=>{if(!cur)return;if(tool==='pen')cur.p.push(pos(e));else cur.p[1]=pos(e);redraw()};
 cv.onpointerup=()=>{if(cur&&cur.p.length>1)shapes.push(cur);cur=null;redraw()};
 const mark=()=>{md.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));md.querySelectorAll('[data-c]').forEach(b=>b.style.outline=b.dataset.c===col?'3px solid #E9A23B':'')};mark();
 md.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;mark()});md.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{col=b.dataset.c;mark()});
 md.querySelector('#un').onclick=()=>{shapes.pop();redraw()};md.querySelector('#cn').onclick=()=>md.remove();
 md.querySelector('#dn').onclick=()=>{cv.toBlob(b=>{const t=document.createElement('canvas');const ts=200/Math.max(W,H);t.width=W*ts;t.height=H*ts;t.getContext('2d').drawImage(cv,0,0,t.width,t.height);md.remove();done(b,t.toDataURL('image/jpeg',.7))},'image/jpeg',.82)}}

function renderDash(){

 $('#main').innerHTML=`<div class="card"><div class="seg" id="pm">${[['day','Day'],['week','Week'],['month','Month'],['year','Year'],['custom','Custom']].map(([k,l])=>`<button data-m="${k}" class="${p.mode===k?'on':''}">${l}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px">${p.mode==='day'?`<select id="dp" class="grow">${S.days.map(d=>`<option value="${d.id}" ${S.dayPick===d.id?'selected':''}>${d.id} (${fmtDT(d.start)} → ${d.end?fmtDT(d.end):'running'})</option>`).join('')||'<option>No production days</option>'}</select>`

   const rows=async t=>(await this.g(tok,'GET',`${base}/tables/${t}/rows?$top=10000`)).value.map(x=>x.values[0]);
   const kinds=Object.fromEntries(Object.entries(KIND_LABEL).map(([a,b])=>[b,a]));
   for(const v of await rows('ProductionDays')){const o=Object.fromEntries(DAY_COLS.map((c,i)=>[c,v[i]]));if(!o.ID)continue;const loc=S.days.find(d=>d.id===o.ID);if(loc&&loc.updatedAt>=+o.UpdatedAt)continue;
    await DB.put('days',o.ID,{id:o.ID,start:+o.StartMs,end:o.EndMs?+o.EndMs:null,startedBy:o.StartedBy,endedBy:o.EndedBy,chickens:o.Chickens,updatedAt:+o.UpdatedAt,synced:true})}
   const remote=new Set();
   for(const v of await rows('Records')){const o=Object.fromEntries(REC_COLS.map((c,i)=>[c,v[i]]));if(!o.ID)continue;remote.add(o.ID);const loc=S.records.find(d=>d.id===o.ID);if(loc&&loc.updatedAt>=+o.UpdatedAt)continue;
    const ph=String(o.Photos||'').split(' ').filter(Boolean),vd=String(o.Videos||'').split(' ').filter(Boolean);const mk=async(u,t)=>{const id='R'+btoa(u).slice(-16).replace(/\W/g,'');if(!(await DB.get('media',id)))await DB.put('media',id,{id,type:t,url:u,synced:true});return id};
    await DB.put('records',o.ID,{id:o.ID,dayId:o.ProdDayID,kind:kinds[o.Kind]||'breakdown',category:o.Type,area:o.Area,equipment:o.Equipment,description:o.Description,start:+o.StartMs,end:o.EndMs?+o.EndMs:null,reportedBy:o.ReportedBy,closedBy:o.ClosedBy,rootCause:o.RootCause,action:o.Action,notes:o.Notes,line:o.Line||'Primary',photos:await Promise.all(ph.map(u=>mk(u,'image'))),videos:await Promise.all(vd.map(u=>mk(u,'video'))),updatedAt:+o.UpdatedAt,synced:true})}
   for(const r of S.records)if(r.synced&&!remote.has(r.id))await DB.del('records',r.id);
   // lists
   try{const mrows=await rows('Machines');if(mrows.length){const m={},sec=[];mrows.forEach(([a,b,l])=>{if(!a)return;a=String(a);if(String(l||'').toLowerCase().startsWith('sec')){if(!sec.includes(a))sec.push(a)}else if(b)(m[a]=m[a]||[]).push(String(b))});S.machines=m;S.secondary=sec;await DB.put('meta','machines',m);await DB.put('meta','secondary',sec)}
    const urows=await rows('Users');if(urows.length){S.users=urows.filter(x=>x[0]).map(([n,j,r,em,p])=>({name:String(n),job:String(j||''),admin:String(r||'').toLowerCase().startsWith('admin'),pinHash:p!==''&&p!=null?pinHash(n,String(p).padStart(4,'0')):''}));await DB.put('meta','users',S.users);if(S.user){const me=S.users.find(u=>u.name===S.user.name);if(me)S.user=me}}}catch(e){}
   this.status='Last sync '+fmtDT(Date.now());await load();if(S.tab!=='add')render()}
  catch(e){this.status='Sync error: '+e.message;console.warn(e)}finally{this.busy=false;const el=$('#syncst');if(el)el.textContent=this.label()}}};

/* ---------- start ---------- */
(async()=>{if(window.opener&&window.opener!==window&&/[#&?](code|error)=/.test(location.hash+location.search)){document.getElementById('app').innerHTML='<div class="login"><h2>Signing in…</h2></div>';return}
 await DB.open();await load();render();
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(S.settings.clientId){Sync.run(false);setInterval(()=>Sync.run(false),60000)}
 addEventListener('online',()=>Sync.run(false))})();
</script>
